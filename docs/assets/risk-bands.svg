<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 800 342" role="img" aria-labelledby="risk-bands-title risk-bands-description">
  <title id="risk-bands-title">Default probability risk bands</title>
  <desc id="risk-bands-description">Configurable defaults on a risk score from 0 to 1. Scores below 0.50 allow. Scores from 0.50 inclusive to below 0.70 request Hermes approval. Scores from 0.70 inclusive through 1 block. The score is not guaranteed to be calibrated. Hermes policy may approve a request without a human prompt.</desc>
  <defs>
    <linearGradient id="risk-bands-allow" x2="0" y2="1"><stop stop-color="#4ac69a"/><stop offset="1" stop-color="#16836f"/></linearGradient>
    <linearGradient id="risk-bands-approval" x2="0" y2="1"><stop stop-color="#f4c45e"/><stop offset="1" stop-color="#c98720"/></linearGradient>
    <linearGradient id="risk-bands-block" x2="0" y2="1"><stop stop-color="#ff8178"/><stop offset="1" stop-color="#d64d5d"/></linearGradient>
    <clipPath id="risk-bands-scale"><rect x="40" y="107" width="720" height="54" rx="12"/></clipPath>
  </defs>
  <rect x="1" y="1" width="798" height="340" rx="24" fill="#151a22" stroke="#343e4c" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="40" y="52" fill="#f1f5f9" font-size="27" font-weight="700">Probability risk bands</text>
    <rect x="580" y="24" width="180" height="34" rx="17" fill="#203444" stroke="#426376"/>
    <text x="670" y="47" text-anchor="middle" fill="#a9dce5" font-size="16" font-weight="650">Configurable defaults</text>
    <text x="40" y="83" fill="#b8c3d1" font-size="16">Judge risk score · not guaranteed to be calibrated</text>
    <g clip-path="url(#risk-bands-scale)">
      <rect x="40" y="107" width="360" height="54" fill="url(#risk-bands-allow)"/>
      <rect x="400" y="107" width="144" height="54" fill="url(#risk-bands-approval)"/>
      <rect x="544" y="107" width="216" height="54" fill="url(#risk-bands-block)"/>
      <path d="M400 107v54m144-54v54" stroke="#151a22" stroke-width="3"/>
      <path d="M40 109h720" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    </g>
    <path d="M40 169v8m360-8v8m144-8v8m216-8v8" stroke="#8491a2" stroke-width="2"/>
    <g fill="#e6edf5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">
      <text x="40" y="201">0</text>
      <text x="400" y="201" text-anchor="middle">.50</text>
      <text x="544" y="201" text-anchor="middle">.70</text>
      <text x="760" y="201" text-anchor="end">1</text>
    </g>
    <path d="M40 219h720" stroke="#343e4c"/>
    <circle cx="50" cy="250" r="7" fill="#4ac69a"/>
    <text x="68" y="257" fill="#74dfbd" font-size="20" font-weight="700">ALLOW</text>
    <text x="68" y="280" fill="#c4ceda" font-size="16">p &lt; .5</text>
    <circle cx="285" cy="250" r="7" fill="#f4c45e"/>
    <text x="303" y="257" fill="#f5cf79" font-size="20" font-weight="700">ASK HERMES</text>
    <text x="303" y="280" fill="#c4ceda" font-size="16">.5 ≤ p &lt; .7</text>
    <circle cx="550" cy="250" r="7" fill="#ff8178"/>
    <text x="568" y="257" fill="#ff9b93" font-size="20" font-weight="700">BLOCK</text>
    <text x="568" y="280" fill="#c4ceda" font-size="16">p ≥ .7</text>
    <text x="40" y="319" fill="#aeb9c7" font-size="15">Approval is subject to Hermes policy; YOLO may auto-approve.</text>
  </g>
</svg>
