name: one-guard
version: 0.1.0
description: Fail-closed security judgment using chat completions or native System One.
provides_hooks:
  - pre_tool_call
config_schema:
  protocol:
    type: str
    default: chat_completions
  endpoint:
    type: str
    default: http://127.0.0.1:8080/v1/chat/completions
  token:
    type: secret
    env: ONE_GUARD_TOKEN
  judge_model:
    type: str
    default: ""
  prompt:
    type: str
    default: ""
  mode:
    type: str
    default: yes_no
  timeout:
    type: float
    default: 5.0
    description: "Judge deadline in seconds, 0.01 through 120. Hermes hook_callback_timeout must allow enough time."
  threshold:
    type: float
    default: 0.7
    description: "Risk score at or above which the call is blocked (probability mode only)."
  approval_threshold:
    type: float
    default: 0.5
    description: "Risk score at or above which the call needs human approval, below the block threshold."
  allow_insecure_http:
    type: bool
    default: false
