[project]
name = "one-guard"
version = "0.1.0"
description = "A fail-closed native Hermes tool guard"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
installer-ui = ["prompt_toolkit==3.0.53"]

[tool.one_guard]
test = "python3 -m unittest discover -s tests -p 'test_*.py' -v"
integration = "sh scripts/verify-hermes.sh"
compile = "python3 -m compileall -q plugins/one-guard scripts tests"
smoke_systemone = "python3 scripts/smoke-systemone.py --help"
